# Testes em contêiner (R-16): a máquina só precisa do runtime de contêineres.
#   docker compose -f infra/compose.test.yaml run --rm testes-backend
#   docker compose -f infra/compose.test.yaml run --rm testes-frontend
#   docker compose -f infra/compose.test.yaml run --rm testes-e2e
#   docker compose -f infra/compose.test.yaml run --rm testes-ia-real
name: relatorios-testes

x-maven: &maven
  image: maven:3.9-eclipse-temurin-25
  working_dir: /work/backend
  volumes:
    - ..:/work
    - m2:/root/.m2
  environment: &maven-env
    DATABASE_URL: jdbc:postgresql://postgres-teste:5432/relatorios_teste
    DATABASE_USER: relatorios
    DATABASE_PASSWORD: teste
    CONTRATO_API: /work/specs/001-fluxo-relatorios/contracts/api-portal.openapi.yaml
  depends_on:
    postgres-teste:
      condition: service_healthy

services:
  postgres-teste:
    image: postgres:18
    # cada contexto de teste em cache abre o próprio pool (10 conexões); os testes com @MockitoSpyBean
    # criam contextos distintos, e o limite padrão de 100 conexões já não basta
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: relatorios_teste
      POSTGRES_USER: relatorios
      POSTGRES_PASSWORD: teste
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relatorios -d relatorios_teste"]
      interval: 2s
      timeout: 3s
      retries: 30

  testes-backend:
    <<: *maven
    # FFmpeg para FfmpegNormalizacaoAudioAdaptadorIT (o mesmo binário da imagem do backend)
    command: ["sh", "-c", "apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null && mvn -B -ntp verify"]

  testes-ia-real:
    <<: *maven
    environment:
      <<: *maven-env
      AI_PROVIDERS: real
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL:-https://api.groq.com/openai/v1}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      LLM_URL: ${LLM_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ASSETS_DIR: /assets
    volumes:
      - ..:/work
      - m2:/root/.m2
      - ../assets:/assets:ro
    command: ["sh", "-c", "apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null && mvn -B -ntp -Preal-ai verify"]

  testes-frontend:
    image: node:24-alpine
    working_dir: /work/frontend
    volumes:
      - ..:/work
      - node-modules:/work/frontend/node_modules
    command: ["sh", "-c", "npm ci && npm run lint && npm run typecheck && npm test"]

  # Pilha completa com IA simulada para os testes ponta a ponta (Playwright + axe).
  postgres-e2e:
    image: postgres:18
    environment:
      POSTGRES_DB: relatorios
      POSTGRES_USER: relatorios
      POSTGRES_PASSWORD: e2e
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relatorios -d relatorios"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-e2e:
    build:
      context: ../backend
      dockerfile: application/Dockerfile
    image: relatorios-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-e2e:5432/relatorios
      DATABASE_USER: relatorios
      DATABASE_PASSWORD: e2e
      AI_PROVIDERS: simulated
      TELEGRAM_ENABLED: "false"
      CPF_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      HMAC_SECRET: segredo-hmac-de-testes-e2e-com-mais-de-32-bytes
      SESSION_COOKIE_SECURE: "true"
      DOCUMENTS_DIR: /dados/documentos
      AUDIO_TEMP_DIR: /tmp/audios
    tmpfs:
      - /tmp/audios:mode=1777
    depends_on:
      postgres-e2e:
        condition: service_healthy
    networks:
      default:
        aliases: [backend]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web-e2e:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: relatorios-web
    environment:
      DOMAIN: web-e2e
      LOCAL_CERTIFICATES: local_certs
    depends_on:
      backend-e2e:
        condition: service_healthy

  testes-e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /work/frontend
    environment:
      E2E_URL: https://web-e2e
      E2E_DATABASE_URL: postgres://relatorios:e2e@postgres-e2e:5432/relatorios
      # Os mesmos segredos de testes do backend-e2e: a semeadura grava o HMAC e o CPF cifrado.
      E2E_CPF_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      E2E_HMAC_SECRET: segredo-hmac-de-testes-e2e-com-mais-de-32-bytes
    volumes:
      - ..:/work
      - node-modules-e2e:/work/frontend/node_modules
    depends_on:
      web-e2e:
        condition: service_started
    command: ["sh", "-c", "npm ci && npx playwright test"]

volumes:
  m2:
  node-modules:
  node-modules-e2e:
