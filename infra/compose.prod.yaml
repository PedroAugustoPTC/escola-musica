# Produção na VPS: só o `web` (Caddy, HTTPS) publica portas; os demais ficam na rede interna.
services:
  web:
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
  backend:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  telegram-bot-api:
    restart: unless-stopped
  # Editor desligado e nenhuma porta: workflows só mudam por PR e nova imagem (feature 004, FR-002 e FR-008).
  n8n:
    restart: unless-stopped
    environment:
      N8N_DISABLE_UI: "true"
