# Configuração lida do ambiente (infra/.env.example). Nenhum segredo fica versionado (Princípio IV).
spring:
  application:
    name: reports
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reports}
    username: ${DATABASE_USER:reports}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      # O limite de negócio é conferido pelo adaptador (AUDIO_LIMIT_MB); aqui fica uma folga de 1 MB
      # para que o excesso seja respondido com 413 AUDIO_MUITO_GRANDE.
      max-file-size: ${MULTIPART_LIMIT_MB:51}MB
      max-request-size: ${MULTIPART_LIMIT_MB:51}MB
      file-size-threshold: 0
      location: ${AUDIO_TEMP_DIR:/tmp/audios}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

reports:
  school:
    timezone: ${SCHOOL_TIMEZONE:America/Sao_Paulo}
  audio:
    limit-mb: ${AUDIO_LIMIT_MB:50}
    temp-dir: ${AUDIO_TEMP_DIR:/tmp/audios}
  session:
    hours: ${WEB_SESSION_HOURS:12}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
  access:
    max-attempts: ${ACCESS_MAX_ATTEMPTS:5}
    lock-minutes: ${ACCESS_LOCK_MINUTES:15}
  code:
    validity-days: ${CODE_VALIDITY_DAYS:7}
  security:
    cpf-encryption-key: ${CPF_ENCRYPTION_KEY:}
    hmac-secret: ${HMAC_SECRET:}
  documents:
    dir: ${DOCUMENTS_DIR:/data/documents}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    api-url: ${TELEGRAM_API_URL:http://telegram-bot-api:8081}
    token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    webhook-url: ${TELEGRAM_WEBHOOK_URL:http://backend:8080/telegram/webhook}
    files-dir: ${TELEGRAM_FILES_DIR:/var/lib/telegram-bot-api}
    pending-audio-minutes: ${PENDING_AUDIO_MINUTES:30}
  telegram-channel:
    # DIRECT = envio direto à API de bots (padrão); ORCHESTRATOR = outbox entregue ao n8n (feature 003)
    proactive-delivery: ${TELEGRAM_CHANNEL_DELIVERY:DIRECT}
    current-token: ${TELEGRAM_CHANNEL_CURRENT_TOKEN:}
    next-token: ${TELEGRAM_CHANNEL_NEXT_TOKEN:}
    orchestrator-url: ${TELEGRAM_CHANNEL_ORCHESTRATOR_URL:}
    orchestrator-token: ${TELEGRAM_CHANNEL_ORCHESTRATOR_TOKEN:}
    connection-timeout-ms: ${TELEGRAM_CHANNEL_CONNECTION_TIMEOUT_MS:3000}
    response-timeout-ms: ${TELEGRAM_CHANNEL_RESPONSE_TIMEOUT_MS:10000}
    retry-initial-seconds: ${TELEGRAM_CHANNEL_RETRY_INITIAL_S:30}
    retry-ceiling-seconds: ${TELEGRAM_CHANNEL_RETRY_CEILING_S:900}
    deadline-hours: ${TELEGRAM_CHANNEL_DEADLINE_H:24}
    confirmation-max-seconds: ${TELEGRAM_CHANNEL_CONFIRMATION_MAX_S:60}
    lease-seconds: ${TELEGRAM_CHANNEL_LEASE_S:60}
    dispatch-interval-ms: ${TELEGRAM_CHANNEL_DISPATCH_INTERVAL_MS:2000}
    batch-max-per-cycle: ${TELEGRAM_CHANNEL_BATCH_MAX:20}
    payload-retention-hours: ${TELEGRAM_CHANNEL_PAYLOAD_RETENTION_H:24}
    record-retention-days: ${TELEGRAM_CHANNEL_RECORD_RETENTION_D:7}
  providers:
    mode: ${AI_PROVIDERS:simulated}
    transcription:
      url: ${TRANSCRIPTION_URL:https://api.groq.com/openai/v1}
      model: ${TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
      key: ${TRANSCRIPTION_API_KEY:}
      price-usd-per-hour: ${TRANSCRIPTION_PRICE_USD_PER_HOUR:0.04}
    llm:
      url: ${LLM_URL:https://api.groq.com/openai/v1}
      model: ${LLM_MODEL:llama-3.3-70b-versatile}
      key: ${LLM_API_KEY:}
      price-usd-per-million-input: ${LLM_PRICE_USD_PER_MILLION_INPUT:0.59}
      price-usd-per-million-output: ${LLM_PRICE_USD_PER_MILLION_OUTPUT:0.79}
  jobs:
    workers: ${JOBS_WORKERS:2}
    interval-ms: ${JOBS_INTERVAL_MS:500}

---
spring:
  config:
    activate:
      on-profile: seed
  main:
    web-application-type: none
    banner-mode: "off"
