# Catálogo único de mensagens ao professor, usado pelos DOIS canais (FR-003, R-18).
# Fonte: specs/001-fluxo-relatorios/contracts/mensagens.md. O build do frontend gera mensagens.json
# a partir deste arquivo. Formato: CODIGO=texto em uma linha; placeholders entre chaves.
# O CatalogoMensagensTeste falha se algum CodigoErro do núcleo não tiver texto aqui.

# --- Acesso
CODE_REQUIRED=Olá! Para usar o bot, envie o código de acesso que você recebeu da secretaria da escola.
INVALID_CODE=Código inválido. Confira o código e tente de novo, ou peça um novo à secretaria da escola.
EXPIRED_CODE=Este código venceu após 7 dias sem uso. Peça um novo código à secretaria da escola.
TEMPORARILY_BLOCKED=Acesso bloqueado temporariamente por muitas tentativas incorretas. Tente novamente em {minutes} minuto(s).
LINK_CREATED=Conta vinculada com sucesso, {name}!
TELEGRAM_ALREADY_LINKED=Esta conta do Telegram já está vinculada a outro professor. Procure a secretaria da escola.
TEACHER_ALREADY_LINKED=Seu cadastro já está vinculado a outra conta do Telegram. Procure a secretaria da escola.
SESSION_EXPIRED=Sua sessão expirou. Entre novamente com o seu código.
NOT_AUTHENTICATED=Entre com o seu código de acesso para continuar.
SESSION_ENDED=Sessão encerrada.
CONFIRM_SIGN_OUT=Deseja sair? Para usar o bot de novo, será preciso enviar o código de acesso.
LINK_ENDED=Você saiu. Para voltar, envie o seu código de acesso.
NO_CONNECTION=Não foi possível entrar agora. Verifique sua conexão e tente novamente.

