# Catálogo único de mensagens ao professor, usado pelos DOIS canais (FR-003, R-18).
# Fonte: specs/001-fluxo-relatorios/contracts/mensagens.md. O build do frontend gera mensagens.json
# a partir deste arquivo. Formato: CODIGO=texto em uma linha; placeholders entre chaves.
# O CatalogoMensagensTeste falha se algum CodigoErro do núcleo não tiver texto aqui.

# --- Acesso
CODIGO_NECESSARIO=Olá! Para usar o bot, envie o código de acesso que a secretaria da escola te passou.
CODIGO_INVALIDO=Código inválido. Confira o código e tente de novo, ou peça um novo à secretaria da escola.
CODIGO_EXPIRADO=Este código venceu após 7 dias sem uso. Peça um novo código à secretaria da escola.
BLOQUEADO_TEMPORARIAMENTE=Acesso bloqueado temporariamente por muitas tentativas incorretas. Tente novamente em {minutos} minuto(s).
VINCULO_CRIADO=Conta vinculada com sucesso, {nome}!
TELEGRAM_JA_VINCULADO=Esta conta do Telegram já está vinculada a outro professor. Procure a secretaria da escola.
PROFESSOR_JA_VINCULADO=Seu cadastro já está vinculado a outra conta do Telegram. Procure a secretaria da escola.
SESSAO_EXPIRADA=Sua sessão expirou. Entre novamente com o seu código.
NAO_AUTENTICADO=Entre com o seu código de acesso para continuar.
SESSAO_ENCERRADA=Sessão encerrada.
CONFIRMAR_SAIR=Deseja sair? Para usar o bot de novo, será preciso enviar o código de acesso.
VINCULO_ENCERRADO=Você saiu. Para voltar, envie o seu código de acesso.
SEM_CONEXAO=Não foi possível entrar agora. Verifique sua conexão e tente novamente.

