<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${titulo}">Relatório de Aula</title>
  <style th:utext="${estilos}"></style>
  <style th:utext="${estiloPaginacao}"></style>
</head>
<body>
  <div class="rodape">
    <img th:src="${imagens['filete']}" alt=""/>
    <table>
      <tr>
        <td th:text="${rodapeTexto}">Instituto Musical Felipe Blaft — relatório pedagógico de aula.</td>
        <td class="pagina"><span class="paginacao"></span></td>
      </tr>
    </table>
  </div>

  <div class="faixa-conferencia" th:if="${conferencia}" th:text="${faixa}">Documento em conferência — não oficial</div>

  <div class="cabecalho">
    <img th:src="${imagens['logo']}" alt="Instituto Musical Felipe Blaft"/>
    <div class="sobretitulo">RELATÓRIO PEDAGÓGICO</div>
    <h1 th:text="${titulo}">Relatório de Aula</h1>
  </div>

  <table class="dados">
    <tr>
      <td class="primeiro"><div class="rotulo">ALUNO</div><div class="valor" th:text="${aluno}">Aluno</div></td>
      <td><div class="rotulo">PROFESSOR</div><div class="valor" th:text="${professor}">Professor</div></td>
      <td><div class="rotulo">DATA DA AULA</div><div class="valor" th:text="${data}">30/09/2026</div></td>
    </tr>
  </table>

  <div class="secao" th:each="secao : ${secoes}">
    <h2 th:text="${secao.titulo}">Seção</h2>
    <ul th:unless="${secao.itens.isEmpty()}">
      <li th:each="item : ${secao.itens}" th:text="${item}">item</li>
    </ul>
    <p th:if="${secao.itens.isEmpty()}" th:text="${secao.texto}">texto</p>
  </div>

  <div class="aprovacao" th:if="${aprovacao != null}" th:text="${aprovacao}">Aprovado por … · versão 2</div>
  <div class="aprovacao" th:if="${aprovacao == null}" th:text="${versaoTexto}">Versão 1</div>
</body>
</html>
