# CI (Princípio V): testes em contêiner; teste vermelho ou cobertura do núcleo abaixo de 90% bloqueiam o merge.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unitários, arquitetura, integração, contrato, cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # FR-035 (feature 003): o guardião de idioma não aceita lista de exclusões temporárias. A migração terminou e o
      # arquivo foi apagado; este passo reprova qualquer PR que o traga de volta.
      - name: Garantir que não há exclusões temporárias do guardião
        run: test ! -e .specify/memory/glossary-temporary-exclusions.json
      # FR-071 (feature 007): aviso, nunca reprova.
      - name: Avisar se o inventário de tratamento precisa de revisão
        run: |
          sh infra/scripts/check-inventory-review.sh origin/main
      - name: Testes do backend
        run: docker compose -f infra/compose.test.yaml run --rm tests-backend
      - name: Relatório de cobertura do núcleo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-core
          path: backend/core/target/site/jacoco/
          if-no-files-found: ignore
      - name: Derrubar serviços
        if: always()
        run: docker compose -f infra/compose.test.yaml down -v

  frontend:
    name: Frontend (lint, tipos, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Testes do frontend
        run: docker compose -f infra/compose.test.yaml run --rm tests-frontend

  e2e:
    name: Ponta a ponta e acessibilidade (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Testes ponta a ponta
        run: docker compose -f infra/compose.test.yaml run --rm --build tests-e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
      - name: Derrubar serviços
        if: always()
        run: docker compose -f infra/compose.test.yaml down -v

  # Feature 004: o n8n real em contêiner (imagem de produção, Telegram e backend simulados): utilitários, contrato dos
  # workflows e, nas fases seguintes, a suíte de conversa e de paridade pelo n8n, duplicidade, resiliência e privacidade.
  # O docker.n8n.io limita a taxa (429) dos executores do GitHub. A imagem base vem do cache ou, sem ele, POR DIGEST do
  # docker.n8n.io, do ghcr.io ou do Docker Hub (infra/scripts/ci-n8n-image.sh); com ela no Docker local o build não consulta
  # o registro. Os passos de build ainda repetem se o 429 vier (infra/scripts/retry-rate-limit.sh).
  n8n:
    name: n8n (transporte do Telegram em contêiner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Cache da imagem base do n8n
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/n8n-image.tar
          key: n8n-image-${{ hashFiles('infra/n8n/Dockerfile') }}
      - name: Imagem base do n8n (cache, ou por digest com origens alternativas)
        run: sh infra/scripts/ci-n8n-image.sh /tmp/n8n-image.tar
      - name: Utilitários do n8n e do simulador
        run: |
          sh infra/scripts/retry-rate-limit.sh docker compose -f infra/compose.test.yaml run --rm --build tests-n8n-ops
          sh infra/scripts/retry-rate-limit.sh docker compose -f infra/compose.test.yaml run --rm --build tests-simulator
      - name: Testes pelo n8n
        run: sh infra/scripts/retry-rate-limit.sh docker compose -f infra/compose.test.yaml run --rm --build --use-aliases tests-n8n
      - name: Ensaio da troca do webhook e da rotação do token
        run: sh infra/scripts/retry-rate-limit.sh sh infra/scripts/local.sh tests rehearsal
      - name: Logs do n8n
        if: failure()
        run: docker compose -f infra/compose.test.yaml logs --no-color n8n-test | tail -n 200
      - name: Derrubar serviços
        if: always()
        run: docker compose -f infra/compose.test.yaml down -v
