# CI (Princípio V): testes em contêiner; teste vermelho ou cobertura do núcleo abaixo de 90% bloqueiam o merge.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unitários, arquitetura, integração, contrato, cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # FR-035 (feature 003): o guardião de idioma não aceita lista de exclusões temporárias. A migração terminou e o
      # arquivo foi apagado; este passo reprova qualquer PR que o traga de volta.
      - name: Garantir que não há exclusões temporárias do guardião
        run: test ! -e .specify/memory/glossary-temporary-exclusions.json
      - name: Testes do backend
        run: docker compose -f infra/compose.test.yaml run --rm tests-backend
      - name: Relatório de cobertura do núcleo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-core
          path: backend/core/target/site/jacoco/
          if-no-files-found: ignore
      - name: Derrubar serviços
        if: always()
        run: docker compose -f infra/compose.test.yaml down -v

  frontend:
    name: Frontend (lint, tipos, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Testes do frontend
        run: docker compose -f infra/compose.test.yaml run --rm tests-frontend

  e2e:
    name: Ponta a ponta e acessibilidade (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Testes ponta a ponta
        run: docker compose -f infra/compose.test.yaml run --rm --build tests-e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
      - name: Derrubar serviços
        if: always()
        run: docker compose -f infra/compose.test.yaml down -v

  # Feature 004: o n8n real em contêiner (imagem de produção, Telegram e backend simulados): utilitários, contrato dos
  # workflows e, nas fases seguintes, a suíte de conversa e de paridade pelo n8n, duplicidade, resiliência e privacidade.
  n8n:
    name: n8n (transporte do Telegram em contêiner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Utilitários do n8n e do simulador
        run: |
          docker compose -f infra/compose.test.yaml run --rm --build tests-n8n-ops
          docker compose -f infra/compose.test.yaml run --rm --build tests-simulator
      - name: Testes pelo n8n
        run: docker compose -f infra/compose.test.yaml run --rm --build --use-aliases tests-n8n
      - name: Ensaio da troca do webhook e da rotação do token
        run: sh infra/scripts/local.sh tests rehearsal
      - name: Logs do n8n
        if: failure()
        run: docker compose -f infra/compose.test.yaml logs --no-color n8n-test | tail -n 200
      - name: Derrubar serviços
        if: always()
        run: docker compose -f infra/compose.test.yaml down -v
