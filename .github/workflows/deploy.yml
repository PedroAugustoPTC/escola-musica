# Implantação manual na VPS (infra/README.md). O ambiente "production" deve exigir aprovação
# (Settings → Environments → Required reviewers) e guardar os segredos de SSH abaixo.
name: Implantar

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch a implantar
        required: true
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Implantar na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOST: ${{ secrets.VPS_KNOWN_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts
      - name: Executar deploy.sh na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DIRECTORY: ${{ secrets.VPS_DIRECTORY }}
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            *[!A-Za-z0-9._/-]*) echo "Nome de branch inválido" >&2; exit 1 ;;
          esac
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DIRECTORY' && sh infra/scripts/deploy.sh '$BRANCH'"
      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/id_deploy
