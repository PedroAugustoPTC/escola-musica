# Implantação manual na VPS Hostinger (infra/README.md). O ambiente "producao" deve exigir aprovação
# (Settings → Environments → Required reviewers) e guardar os segredos de SSH abaixo.
name: Implantar

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch a implantar
        required: true
        default: main

concurrency:
  group: implantar
  cancel-in-progress: false

jobs:
  implantar:
    name: Implantar na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: producao
    steps:
      - name: Configurar SSH
        env:
          VPS_CHAVE_SSH: ${{ secrets.VPS_CHAVE_SSH }}
          VPS_HOST_CONHECIDO: ${{ secrets.VPS_HOST_CONHECIDO }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_CHAVE_SSH" > ~/.ssh/id_implantacao
          chmod 600 ~/.ssh/id_implantacao
          printf '%s\n' "$VPS_HOST_CONHECIDO" > ~/.ssh/known_hosts
      - name: Executar implantar.sh na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USUARIO: ${{ secrets.VPS_USUARIO }}
          VPS_DIRETORIO: ${{ secrets.VPS_DIRETORIO }}
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            *[!A-Za-z0-9._/-]*) echo "Nome de branch inválido" >&2; exit 1 ;;
          esac
          ssh -i ~/.ssh/id_implantacao -o StrictHostKeyChecking=yes "$VPS_USUARIO@$VPS_HOST" \
            "cd '$VPS_DIRETORIO' && sh infra/scripts/implantar.sh '$BRANCH'"
      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/id_implantacao
