openapi: 3.1.0
info:
  title: API interna de canal do Telegram
  version: v1
  description: |
    Rotas internas usadas pelo orquestrador de canal (n8n) para transportar o Telegram.
    O formato dos corpos é normativo em `acoes-v1.schema.json` (mesma pasta); o texto de regras,
    cabeçalhos de entrega e obrigações do orquestrador está em `canal-telegram-interno.md`.
    A área `/interno/**` NÃO é publicada pelo proxy e não aceita sessão de portal.
servers:
  - url: http://backend:8080
    description: rede interna de serviços
security:
  - tokenServico: []

paths:
  /interno/v1/canal/telegram/atualizacao:
    post:
      operationId: receberAtualizacao
      summary: Recebe o update bruto do Telegram e devolve as ações a executar
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema: { type: string }
          description: segredo do webhook do Telegram; comparado em tempo constante
      requestBody:
        required: true
        description: objeto `Update` do Telegram, sem alterações
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: ações na ordem de execução (pode ser lista vazia)
          content:
            application/json:
              schema:
                $ref: "./acoes-v1.schema.json#/$defs/RespostaAtualizacao"
        "401":
          $ref: "#/components/responses/NaoAutenticado"

  /interno/v1/canal/telegram/confirmacoes:
    post:
      operationId: confirmarExecucao
      summary: Informa o resultado da execução de ações (respostas a update e proativas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./acoes-v1.schema.json#/$defs/RequisicaoConfirmacao"
      responses:
        "200":
          description: confirmações registradas; `ignoradas` lista ids sem efeito (não é erro)
          content:
            application/json:
              schema:
                $ref: "./acoes-v1.schema.json#/$defs/RespostaConfirmacao"
        "400":
          description: corpo inválido ou versão não suportada
          content:
            application/json:
              schema:
                $ref: "./acoes-v1.schema.json#/$defs/Erro"
        "401":
          $ref: "#/components/responses/NaoAutenticado"

  /interno/v1/canal/telegram/documentos/{documentoId}:
    get:
      operationId: obterDocumento
      summary: Bytes do PDF referenciado por uma ação DOCUMENTO
      parameters:
        - name: documentoId
          in: path
          required: true
          schema:
            type: string
            description: identificador opaco da ação; nunca URL nem caminho
      responses:
        "200":
          description: PDF idêntico ao do portal
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /interno/v1/canal/telegram/acoes/{acaoId}:
    get:
      operationId: obterEstadoAcao
      summary: Estado de uma ação (idempotência do receptor sem estado)
      parameters:
        - name: acaoId
          in: path
          required: true
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: estado da ação
          content:
            application/json:
              schema:
                $ref: "./acoes-v1.schema.json#/$defs/RespostaEstadoAcao"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

webhooks:
  entregaProativa:
    post:
      summary: Entrega de ações proativas do backend ao webhook do orquestrador
      description: |
        Chamada feita PELO backend à URL configurada em `CANAL_TELEGRAM_ORQUESTRADOR_URL`.
        Qualquer `2xx` é aceite; qualquer outra resposta, timeout ou erro de conexão mantém a ação
        pendente e a reenvia (30 s dobrando até 15 min, prazo de 24 h). O mesmo `loteId` e os mesmos
        `acaoId` seguem em todas as tentativas; o receptor DEVE tratar repetições como a mesma ação.
      parameters:
        - name: X-Canal-Entrega-Token
          in: header
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
          description: igual a `loteId`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./acoes-v1.schema.json#/$defs/LoteEntrega"
      responses:
        "2XX":
          description: lote aceito (a execução é provada pela confirmação)

components:
  securitySchemes:
    tokenServico:
      type: apiKey
      in: header
      name: X-N8N-Service-Token
      description: |
        Token de serviço do orquestrador. Até dois tokens válidos ao mesmo tempo (rotação), comparados
        em tempo constante. Vale somente em `/interno/**`; não autentica nenhuma rota do portal.
  responses:
    NaoAutenticado:
      description: token ausente, incorreto ou não configurado (e, em `/atualizacao`, segredo do webhook inválido); sem corpo
    NaoEncontrado:
      description: desconhecido, vencido ou malformado; sem corpo e indistinguível
