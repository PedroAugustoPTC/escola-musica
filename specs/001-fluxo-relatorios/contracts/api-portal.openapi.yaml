openapi: 3.1.0
info:
  title: API do Portal do Professor — Relatórios Pedagógicos por Voz
  version: 1.0.0
  description: |
    Contrato entre o frontend (Portal do Professor) e o backend, feature 001-fluxo-relatorios, com os
    nomes técnicos em inglês da feature 003-migrate-code-to-english (Princípio VI). Só os nomes
    mudaram: rotas, parâmetros, campos, valores de enumeração, códigos de erro e o cookie. Os textos
    em português continuam sendo a documentação e o catálogo de mensagens.

    - Autenticação por cookie de sessão `session` (HttpOnly, Secure, SameSite=Strict). A identidade do
      professor vem sempre da sessão, nunca de parâmetros (FR-009).
    - Requisições que alteram estado exigem o cabeçalho `X-CSRF-TOKEN` com o valor do cookie
      `XSRF-TOKEN`.
    - Toda resposta autenticada renova a sessão (12 h de inatividade) e a validade do código (FR-005,
      FR-008).
    - Erros seguem o schema `Error`; os códigos e textos estão em `contracts/mensagens.md`. Nenhum erro
      expõe detalhe interno (FR-054).
    - Aluno não associado e relatório de outro professor → 404 `RESOURCE_NOT_FOUND`, a mesma resposta de
      um recurso inexistente (feature 005, FR-025 e FR-050; o 403 `STUDENT_NOT_ASSIGNED` deixou de existir).
    - O canal Telegram usa os mesmos casos de uso por outro adaptador; ver
      `contracts/telegram-conversa.md`.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - name: Access
  - name: Home
  - name: Students
  - name: LessonReport
  - name: SemesterReport
  - name: Jobs
  - name: History
  - name: Documents

paths:
  /session:
    post:
      tags: [Access]
      summary: Entrar com o código de acesso (FR-004, FR-007)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 16, example: "K7QM2XPA" }
      responses:
        "200":
          description: Sessão criada; cookie `session` definido.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDto" }
        "400": { $ref: "#/components/responses/InvalidData" }
        "401":
          description: "`INVALID_CODE` ou `EXPIRED_CODE`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/Blocked" }
    get:
      tags: [Access]
      summary: Sessão atual
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/SessionDto" } } }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
    delete:
      tags: [Access]
      summary: Encerrar sessão (revoga no servidor)
      responses:
        "204": { description: Sessão encerrada; cookie removido. }
        "401": { $ref: "#/components/responses/NotAuthenticated" }

  /home:
    get:
      tags: [Home]
      summary: Dados do Painel (FR-012, FR-035)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/HomeDto" } } }
        "401": { $ref: "#/components/responses/NotAuthenticated" }

  /students:
    get:
      tags: [Students]
      summary: Alunos associados, com busca aproximada (FR-013)
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/StudentSearchDto" } } }
        "401": { $ref: "#/components/responses/NotAuthenticated" }

  /students/{studentId}:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    get:
      tags: [Students]
      summary: Resumo de um aluno associado
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/StudentSummaryDto" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /students/{studentId}/open-report:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    get:
      tags: [LessonReport]
      summary: Relatório de aula (ou registro em processamento) em aberto para o aluno (FR-034)
      responses:
        "200":
          description: Existe relatório em aberto.
          content: { application/json: { schema: { $ref: "#/components/schemas/OpenReportDto" } } }
        "204": { description: Nenhum relatório em aberto. }
        "404": { $ref: "#/components/responses/NotFound" }

  /students/{studentId}/lesson-reports:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    post:
      tags: [LessonReport]
      summary: Registrar aula por áudio (FR-014 a FR-017); processamento assíncrono
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: MP3, M4A, OGG/Opus, WAV, WebM ou MP4 (só a trilha de áudio). Até 50 MB (configurável).
      responses:
        "202":
          description: Áudio aceito; acompanhar por `/jobs/{jobId}`.
          content: { application/json: { schema: { $ref: "#/components/schemas/JobRefDto" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`REPORT_ALREADY_OPEN` (details traz o relatório em aberto)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413": { $ref: "#/components/responses/AudioTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFormat" }

  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Jobs]
      summary: Etapa e resultado de um processamento (polling a cada 2 s) (FR-021)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/JobDto" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{jobId}/discard:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Jobs]
      summary: Descartar um registro ainda em transcrição (opção "descartar" da retomada)
      responses:
        "204": { description: Descartado. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /lesson-reports/{reportId}:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    get:
      tags: [LessonReport]
      summary: Estado e conteúdo vigente do relatório de aula
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/LessonReportDto" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /lesson-reports/{reportId}/answers:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    post:
      tags: [LessonReport]
      summary: Responder às perguntas pendentes, por texto ou áudio (FR-024, FR-024a, FR-025)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary }
      responses:
        "202":
          description: Resposta aceita; acompanhar pelo trabalho.
          content: { application/json: { schema: { $ref: "#/components/schemas/JobRefDto" } } }
        "400": { $ref: "#/components/responses/InvalidData" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/AudioTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFormat" }

  /lesson-reports/{reportId}/changes:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    post:
      tags: [LessonReport]
      summary: Pedir alteração em linguagem natural, por texto ou áudio (FR-027, FR-027a, FR-033)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeTextRequest" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ChangeAudioRequest" }
      responses:
        "202":
          description: Pedido aceito; acompanhar pelo trabalho.
          content: { application/json: { schema: { $ref: "#/components/schemas/JobRefDto" } } }
        "400": { $ref: "#/components/responses/InvalidData" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStep" }
        "413": { $ref: "#/components/responses/AudioTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFormat" }

  /lesson-reports/{reportId}/retry:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    post:
      tags: [LessonReport]
      summary: Tentar de novo a estruturação sem reenviar o áudio (FR-022)
      responses:
        "202":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/JobRefDto" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /lesson-reports/{reportId}/approval:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    post:
      tags: [LessonReport]
      summary: Aprovar a versão apresentada (FR-028 a FR-030)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalRequest" }
      responses:
        "200":
          description: Aprovado.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalDto" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStep" }

  /lesson-reports/{reportId}/cancellation:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    post:
      tags: [LessonReport]
      summary: Cancelar relatório em aberto (FR-031)
      responses:
        "204": { description: Cancelado. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /lesson-reports/{reportId}/versions/{number}/pdf:
    parameters:
      - { $ref: "#/components/parameters/ReportId" }
      - { $ref: "#/components/parameters/VersionNumber" }
    get:
      tags: [Documents]
      summary: PDF de conferência de uma versão (FR-026, FR-048)
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "404": { $ref: "#/components/responses/NotFound" }

  /lesson-reports/{reportId}/official-pdf:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    get:
      tags: [Documents]
      summary: PDF oficial do relatório aprovado (FR-030, FR-048)
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "404": { $ref: "#/components/responses/NotFound" }

  /students/{studentId}/semesters:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    get:
      tags: [SemesterReport]
      summary: Semestres disponíveis (FR-041)
      responses:
        "200":
          description: Lista em ordem decrescente; vazia gera "Nenhum semestre disponível para este aluno ainda."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemesterDto" }
        "404": { $ref: "#/components/responses/NotFound" }

  /students/{studentId}/semesters/{periodKey}/preview:
    parameters:
      - { $ref: "#/components/parameters/StudentId" }
      - { $ref: "#/components/parameters/PeriodKey" }
    get:
      tags: [SemesterReport]
      summary: Contagens e situação do período antes de gerar (FR-042, FR-046, FR-034)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/SemesterPreviewDto" } } }
        "400": { $ref: "#/components/responses/InvalidData" }
        "404": { $ref: "#/components/responses/NotFound" }

  /students/{studentId}/semester-reports:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    post:
      tags: [SemesterReport]
      summary: Gerar relatório semestral (FR-042 a FR-046); processamento assíncrono
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodKey]
              properties:
                periodKey: { type: string, pattern: "^[0-9]{4}-[12]$", example: "2026-2" }
                confirmDespiteOpenReports: { type: boolean, default: false }
      responses:
        "202":
          description: Consolidação iniciada.
          content: { application/json: { schema: { $ref: "#/components/schemas/JobRefDto" } } }
        "400": { $ref: "#/components/responses/InvalidData" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`NO_APPROVED_LESSONS_IN_PERIOD`, `OPEN_REPORTS_EXIST` (details.count), `SEMESTER_REPORT_ALREADY_APPROVED` ou `REPORT_ALREADY_OPEN` (details do semestral em aberto)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /semester-reports/{reportId}:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    get:
      tags: [SemesterReport]
      summary: Estado e conteúdo vigente do semestral
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/SemesterReportDto" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /semester-reports/{reportId}/changes:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    post:
      tags: [SemesterReport]
      summary: Pedir alteração no semestral, por texto ou áudio (FR-045, FR-027a)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeTextRequest" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ChangeAudioRequest" }
      responses:
        "202":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/JobRefDto" } } }
        "400": { $ref: "#/components/responses/InvalidData" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStep" }
        "413": { $ref: "#/components/responses/AudioTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFormat" }

  /semester-reports/{reportId}/approval:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    post:
      tags: [SemesterReport]
      summary: Aprovar a versão apresentada do semestral
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalRequest" }
      responses:
        "200":
          description: Aprovado.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalDto" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStep" }

  /semester-reports/{reportId}/cancellation:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    post:
      tags: [SemesterReport]
      summary: Cancelar semestral em aberto
      responses:
        "204": { description: Cancelado. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /semester-reports/{reportId}/versions/{number}/pdf:
    parameters:
      - { $ref: "#/components/parameters/ReportId" }
      - { $ref: "#/components/parameters/VersionNumber" }
    get:
      tags: [Documents]
      summary: PDF de conferência de uma versão do semestral
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "404": { $ref: "#/components/responses/NotFound" }

  /semester-reports/{reportId}/official-pdf:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    get:
      tags: [Documents]
      summary: PDF oficial do semestral aprovado
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "404": { $ref: "#/components/responses/NotFound" }

  /students/{studentId}/history:
    parameters: [{ $ref: "#/components/parameters/StudentId" }]
    get:
      tags: [History]
      summary: Relatórios aprovados do professor para o aluno (FR-047)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/HistoryDto" } } }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session

  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PeriodKey:
      name: periodKey
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]{4}-[12]$" }

  responses:
    InvalidData:
      description: "`INVALID_DATA` (ex.: texto vazio)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotAuthenticated:
      description: "`SESSION_EXPIRED` ou `NOT_AUTHENTICATED`; o portal leva à tela Entrar"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "`RESOURCE_NOT_FOUND` (inclui aluno não associado ao professor e relatório de outro professor; a resposta é a mesma de um recurso que não existe, feature 005, FR-025 e FR-050)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: "`ACTION_NOT_ALLOWED_AT_STEP`, `REPORT_ALREADY_APPROVED`, `REPORT_CANCELLED`, `PROCESSING_IN_PROGRESS`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    VersionOrStep:
      description: "`STALE_VERSION` (details.currentVersion) ou um dos códigos de `Conflict`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AudioTooLarge:
      description: "`AUDIO_TOO_LARGE` (details.limitMb)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UnsupportedFormat:
      description: "`UNSUPPORTED_FORMAT`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Blocked:
      description: "`TEMPORARILY_BLOCKED`"
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Pdf:
      description: PDF (inline); o nome sugerido não revela identificadores internos.
      headers:
        Content-Disposition: { schema: { type: string, example: 'inline; filename="relatorio-aula-2026-09-21.pdf"' } }
        Cache-Control: { schema: { type: string, example: "private, no-store" } }
      content:
        application/pdf:
          schema: { type: string, format: binary }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: STALE_VERSION }
        message: { type: string, description: Texto do catálogo `mensagens.md` }
        retryAfterSeconds: { type: integer, description: Só em 429 }
        details:
          type: object
          additionalProperties: true
          description: "Dados estruturados do erro (ex.: currentVersion, count, limitMb, openReport)"

    Channel: { type: string, enum: [WEB, TELEGRAM] }
    Medium: { type: string, enum: [TEXT, AUDIO] }
    ReportType: { type: string, enum: [LESSON, SEMESTER] }
    ReportStatus:
      type: string
      enum: [PROCESSING, PROCESSING_FAILED, AWAITING_ANSWERS, AWAITING_REVIEW, APPROVED, CANCELLED]
    ProcessingStep:
      type: string
      enum: [UPLOADING, TRANSCRIBING, STRUCTURING, INCORPORATING_ANSWERS, TRANSCRIBING_REQUEST, APPLYING_CHANGE, CONSOLIDATING, GENERATING_PDF, READY]

    TeacherSummaryDto:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    SessionDto:
      type: object
      required: [teacher, sessionExpiresAt, telegramLinked]
      properties:
        teacher: { $ref: "#/components/schemas/TeacherSummaryDto" }
        sessionExpiresAt: { type: string, format: date-time }
        telegramLinked: { type: boolean }

    StudentSummaryDto:
      type: object
      required: [id, name, hasOpenReport]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        instrument: { type: [string, "null"] }
        lastLessonAt: { type: [string, "null"], format: date }
        hasOpenReport: { type: boolean }

    StudentSearchDto:
      type: object
      required: [result, students]
      properties:
        result:
          type: string
          enum: [ALL, FOUND, NONE]
          description: NONE traz em `students` todos os alunos do professor
        students:
          type: array
          items: { $ref: "#/components/schemas/StudentSummaryDto" }

    OpenReportDto:
      type: object
      required: [type, studentId, studentName, originChannel, updatedAt]
      properties:
        type: { $ref: "#/components/schemas/ReportType" }
        reportId: { type: [string, "null"], format: uuid, description: Nulo se ainda em transcrição }
        jobId: { type: [string, "null"], format: uuid }
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        status: { oneOf: [{ $ref: "#/components/schemas/ReportStatus" }, { type: "null" }] }
        step: { oneOf: [{ $ref: "#/components/schemas/ProcessingStep" }, { type: "null" }] }
        periodKey: { type: [string, "null"] }
        originChannel: { $ref: "#/components/schemas/Channel" }
        updatedAt: { type: string, format: date-time }

    HomeDto:
      type: object
      required: [teacher, totalStudents, students, openReports, audioLimitMb]
      properties:
        teacher: { $ref: "#/components/schemas/TeacherSummaryDto" }
        totalStudents: { type: integer }
        students:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/StudentSummaryDto" }
        openReports:
          type: array
          items: { $ref: "#/components/schemas/OpenReportDto" }
        audioLimitMb: { type: integer, example: 50 }

    JobRefDto:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }

    JobDto:
      type: object
      required: [jobId, type, status, step, delayed]
      properties:
        jobId: { type: string, format: uuid }
        type: { type: string, enum: [LESSON_REGISTRATION, RETRY, QUESTION_ANSWER, CHANGE, SEMESTER_CONSOLIDATION] }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, DISCARDED] }
        step: { $ref: "#/components/schemas/ProcessingStep" }
        delayed: { type: boolean, description: Verdadeiro após 3 minutos sem conclusão }
        resultCode:
          type: [string, "null"]
          description: READY_FOR_REVIEW, PENDING_QUESTIONS, NEW_VERSION, NO_CONTENT_CHANGE, ACTION_REQUEST_IGNORED, AUDIO_NOT_PROCESSABLE, STRUCTURING_FAILED, CHANGE_FAILED, STALE_VERSION
        reportType: { oneOf: [{ $ref: "#/components/schemas/ReportType" }, { type: "null" }] }
        reportId: { type: [string, "null"], format: uuid }
        understoodText: { type: [string, "null"], description: Transcrição do pedido ou resposta por áudio (FR-024a, FR-027a) }

    LessonReportContentDto:
      type: object
      required: [workedTopics, progress, difficulties, proposedActivities, observations]
      properties:
        workedTopics: { type: array, items: { type: string } }
        progress: { type: string }
        difficulties: { type: array, items: { type: string } }
        proposedActivities: { type: array, items: { type: string } }
        observations: { type: string }

    InteractionDto:
      type: object
      required: [type, channel, medium, text, createdAt]
      properties:
        type: { type: string, enum: [QUESTION_ANSWER, CHANGE] }
        channel: { $ref: "#/components/schemas/Channel" }
        medium: { $ref: "#/components/schemas/Medium" }
        text: { type: string }
        createdAt: { type: string, format: date-time }

    LessonReportDto:
      type: object
      required: [reportId, studentId, studentName, teacherName, lessonDate, status, currentVersion, originChannel, content, pendingQuestions, questionRounds, updatedAt]
      properties:
        reportId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        teacherName: { type: string }
        lessonDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/ReportStatus" }
        step: { oneOf: [{ $ref: "#/components/schemas/ProcessingStep" }, { type: "null" }] }
        activeJobId: { type: [string, "null"], format: uuid }
        currentVersion: { type: integer, minimum: 0 }
        originChannel: { $ref: "#/components/schemas/Channel" }
        content: { $ref: "#/components/schemas/LessonReportContentDto" }
        pendingQuestions: { type: array, items: { type: string } }
        questionRounds: { type: integer, minimum: 0, maximum: 2 }
        lastInteraction: { oneOf: [{ $ref: "#/components/schemas/InteractionDto" }, { type: "null" }] }
        pdfAvailable: { type: boolean }
        approvedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }

    GeneralInformationDto:
      type: object
      required: [name, age, teacher, periodLabel, periodStart, periodEnd, consideredLessonCount]
      properties:
        name: { type: string }
        age: { type: integer }
        instrument: { type: [string, "null"] }
        teacher: { type: string }
        periodLabel: { type: string, example: "2º semestre 2026" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        consideredLessonCount: { type: integer }

    SemesterReportContentDto:
      type: object
      description: Seções 2 a 10 do modelo da escola (ver data-model.md, seção 9)
      required: [attendanceAndStudy, technique, musicality, readingAndMemorization, attentionPoints, pedagogicalStrategies, familySupport, nextSemesterPlan, finalOpinion]
      properties:
        attendanceAndStudy: { type: object, additionalProperties: true }
        technique: { type: object, additionalProperties: true }
        musicality: { type: object, additionalProperties: true }
        readingAndMemorization: { type: object, additionalProperties: true }
        attentionPoints: { type: object, additionalProperties: true }
        pedagogicalStrategies: { type: object, additionalProperties: true }
        familySupport: { type: object, additionalProperties: true }
        nextSemesterPlan: { type: object, additionalProperties: true }
        finalOpinion: { type: string }

    SemesterReportDto:
      type: object
      required: [reportId, studentId, periodKey, status, currentVersion, originChannel, generalInformation, content, openReportCount, updatedAt]
      properties:
        reportId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        periodKey: { type: string }
        status: { $ref: "#/components/schemas/ReportStatus" }
        step: { oneOf: [{ $ref: "#/components/schemas/ProcessingStep" }, { type: "null" }] }
        activeJobId: { type: [string, "null"], format: uuid }
        currentVersion: { type: integer, minimum: 1 }
        originChannel: { $ref: "#/components/schemas/Channel" }
        generalInformation: { $ref: "#/components/schemas/GeneralInformationDto" }
        content: { $ref: "#/components/schemas/SemesterReportContentDto" }
        openReportCount: { type: integer, description: Se > 0, a conferência repete o aviso (FR-042) }
        lastInteraction: { oneOf: [{ $ref: "#/components/schemas/InteractionDto" }, { type: "null" }] }
        pdfAvailable: { type: boolean }
        approvedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }

    ChangeTextRequest:
      type: object
      required: [text, baseVersion]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        baseVersion: { type: integer, minimum: 1, description: Versão que o professor está vendo (FR-033) }

    ChangeAudioRequest:
      type: object
      required: [audio, baseVersion]
      properties:
        audio: { type: string, format: binary }
        baseVersion: { type: integer, minimum: 1 }

    ApprovalRequest:
      type: object
      required: [confirmedVersion]
      properties:
        confirmedVersion: { type: integer, minimum: 1 }

    ApprovalDto:
      type: object
      required: [reportId, status, approvedVersion, approvedAt]
      properties:
        reportId: { type: string, format: uuid }
        status: { type: string, const: APPROVED }
        approvedVersion: { type: integer }
        approvedAt: { type: string, format: date-time }

    SemesterDto:
      type: object
      required: [key, label, start, end, inProgress, preselected]
      properties:
        key: { type: string, example: "2026-2" }
        label: { type: string, example: "2º semestre 2026" }
        start: { type: string, format: date }
        end: { type: string, format: date }
        inProgress: { type: boolean }
        preselected: { type: boolean }

    SemesterPreviewDto:
      type: object
      required: [periodKey, approvedLessons, openLessonReports]
      properties:
        periodKey: { type: string }
        approvedLessons: { type: integer }
        openLessonReports: { type: integer }
        approvedSemesterReportId: { type: [string, "null"], format: uuid }
        openSemesterReport: { oneOf: [{ $ref: "#/components/schemas/OpenReportDto" }, { type: "null" }] }

    HistoryItemDto:
      type: object
      required: [type, reportId, label, approvedAt]
      properties:
        type: { $ref: "#/components/schemas/ReportType" }
        reportId: { type: string, format: uuid }
        label: { type: string, example: "Aula de 21/09/2026" }
        lessonDate: { type: [string, "null"], format: date }
        periodStart: { type: [string, "null"], format: date }
        periodEnd: { type: [string, "null"], format: date }
        approvedAt: { type: string, format: date-time }

    HistoryDto:
      type: object
      required: [student, items]
      properties:
        student: { $ref: "#/components/schemas/StudentSummaryDto" }
        items:
          type: array
          items: { $ref: "#/components/schemas/HistoryItemDto" }
